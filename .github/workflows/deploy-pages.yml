name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Права для деплоя на GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Только один деплой одновременно
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-deploy-${{ hashFiles('**/Cargo.lock') }}

      - name: Build WASM package
        run: |
          cd crates/plantuml-wasm
          wasm-pack build --target web --out-dir ../../playground/pkg

      - name: Strip debug section
        run: |
          # Секция `name` хранит имена функций в отладочном виде. В
          # браузере она бесполезна, а модуль тяжелее на 7.3% — 365 КБ из
          # 4.77 МБ. wasm-opt внутри wasm-pack вырезает её не всегда,
          # поэтому шаг явный.
          python3 scripts/strip-wasm.py --in-place playground/pkg/plantuml_wasm_bg.wasm

      - name: Verify WASM module
        run: |
          # Стриппер переписывает модуль целиком, поэтому результат обязан
          # остаться валидным, а публичные экспорты — на месте.
          node -e "
          const fs = require('fs');
          const bytes = fs.readFileSync('playground/pkg/plantuml_wasm_bg.wasm');
          if (!WebAssembly.validate(bytes)) {
            console.error('модуль невалиден после стриппинга');
            process.exit(1);
          }
          const exports = WebAssembly.Module.exports(new WebAssembly.Module(bytes))
            .map((e) => e.name);
          const required = ['render', 'render_with_theme', 'parse_to_json', 'version'];
          for (const name of required) {
            if (!exports.includes(name)) {
              console.error('нет обязательного экспорта: ' + name);
              process.exit(1);
            }
          }
          console.log('модуль валиден, экспортов: ' + exports.length);
          "

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './playground'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
